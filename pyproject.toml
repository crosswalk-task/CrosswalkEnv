[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crosswalk-env"
version = "1.0.0"
description = "A Gymnasium environment for pedestrian crosswalk tasks"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Jinwoo Jeong" }
]

dependencies = [
    "pygame>=2.1",
    "numpy>=1.21,<3",
    "gymnasium>=0.28,<2",
]

[project.urls]
Repository = "https://github.com/crosswalk-task/CrosswalkEnv"
Issues = "https://github.com/crosswalk-task/CrosswalkEnv/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
crosswalk_env = [
    "sprites/**/*",
]
