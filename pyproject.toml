[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "crosswalk-env"
version = "0.1.0"
description = "A Gymnasium environment for risky decision-making"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Jinwoo Jeong" }
]

dependencies = [
    "pygame>=2.1",
    "numpy>=1.21,<3",
    "gymnasium>=0.28,<2",
]

[project.urls]
Homepage = "https://crosswalk-task.github.io"
Repository = "https://github.com/crosswalk-task/CrosswalkEnv"
Issues = "https://github.com/crosswalk-task/CrosswalkEnv/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crosswalk_env = [
    "sprites/**/*",
]
